<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PBIP Toolkit – Thin report &amp; Transplant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#0F1115;
    --panel:#171A21;
    --panel-2:#1D212A;
    --border:#262B35;
    --text:#E6E9EF;
    --muted:#8A93A6;
    --page:#5B9DFF;
    --bookmark:#FFB454;
    --measure:#C084FC;
    --action:#FF7A45;
    --good:#4ADE80;
    --bad:#F87171;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px; min-height:100vh; }
  a{ color:var(--page); }

  .app{ display:flex; min-height:100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:300px; flex-shrink:0; background:var(--panel);
    border-right:1px solid var(--border); padding:20px;
    display:flex; flex-direction:column; gap:14px;
  }
  .brand{ font-family:var(--mono); font-size:13px; letter-spacing:.04em; color:var(--muted); text-transform:uppercase; }
  .brand b{ color:var(--text); font-weight:600; }

  .mode-tabs{ display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:8px; padding:3px; gap:3px; }
  .mode-tab{
    flex:1; background:transparent; border:none; color:var(--muted); padding:8px 6px;
    border-radius:6px; font-family:var(--sans); font-size:12.5px; font-weight:600; cursor:pointer;
    transition:background .15s, color .15s;
  }
  .mode-tab.active{ background:var(--action); color:#1a0e08; }
  .mode-tab:not(.active):hover{ color:var(--text); }

  .drop{
    display:block; border:1.5px dashed var(--border); border-radius:8px; padding:12px 12px;
    text-align:center; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .drop:hover{ border-color:var(--action); background:rgba(255,122,69,.05); }
  .drop-label{ font-weight:600; font-size:13px; }
  .drop-sub{ color:var(--muted); font-size:11.5px; margin-top:3px; line-height:1.4; }
  .drop.filled{ border-style:solid; border-color:var(--good); background:rgba(74,222,128,.05); }
  input[type=file]{ display:none; }

  .mini-summary{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    padding:9px 10px; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:-6px;
  }
  .mini-summary .name{ color:var(--text); font-weight:600; font-family:var(--sans); font-size:12px; margin-bottom:4px; word-break:break-all; }
  .mini-summary .mini-row{ display:flex; justify-content:space-between; gap:8px; }
  .mini-summary .mini-row b{ color:var(--text); font-weight:600; text-align:right; }
  .mini-summary .good{ color:var(--good); }
  .mini-summary .bad{ color:var(--bad); }

  .filter, .text-in{
    background:var(--panel-2); border:1px solid var(--border); border-radius:6px;
    padding:8px 10px; color:var(--text); font-family:var(--sans); font-size:13px; width:100%;
  }
  .filter:focus, .text-in:focus{ outline:1px solid var(--action); border-color:var(--action); }
  .filter::placeholder, .text-in::placeholder{ color:var(--muted); }

  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opts-title{ font-size:12px; font-weight:600; color:var(--muted); }

  .sidebar-footer{ margin-top:auto; color:var(--muted); font-size:11px; line-height:1.5; padding-top:8px; }

  /* ---------- Main ---------- */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5; background:rgba(15,17,21,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border); padding:14px 24px;
    display:flex; align-items:center; gap:12px;
  }
  .topbar h1{ font-size:15px; margin:0; font-weight:600; }
  .topbar .sel-count{ color:var(--muted); font-size:13px; font-family:var(--mono); }
  .spacer{ flex:1; }
  .btn{
    border:1px solid var(--border); background:var(--panel-2); color:var(--text);
    padding:8px 14px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer;
    font-family:var(--sans); transition:border-color .15s, background .15s;
  }
  .btn:hover{ border-color:var(--muted); }
  .btn.primary{ background:var(--action); border-color:var(--action); color:#1a0e08; font-weight:600; }
  .btn.primary:hover{ background:#ff8c5e; }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.ghost{ background:transparent; }

  .content{ padding:24px; overflow-y:auto; }
  .empty{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:60vh; color:var(--muted); text-align:center; gap:10px;
  }
  .empty h2{ color:var(--text); font-weight:600; font-size:16px; margin:0; }
  .empty p{ max-width:480px; margin:0; font-size:13px; line-height:1.6; }

  .section{ margin-bottom:28px; }
  .section-head{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
    padding-bottom:8px; border-bottom:1px solid var(--border);
  }
  .section-head h3{ font-size:13px; margin:0; color:var(--muted); font-weight:600; }

  .page-group{ margin-bottom:8px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--panel); }
  .row{
    display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer;
    border-bottom:1px solid transparent; transition:background .1s;
  }
  .row.static{ cursor:default; }
  .row:not(.static):hover{ background:var(--panel-2); }
  .row.page-row{ background:var(--panel-2); font-weight:600; }
  .row input[type=checkbox]{ accent-color:var(--action); width:14px; height:14px; flex-shrink:0; }
  .row .label{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .badge{ font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:3px; flex-shrink:0; }
  .badge.page{ background:rgba(91,157,255,.15); color:var(--page); }
  .badge.bookmark{ background:rgba(255,180,84,.15); color:var(--bookmark); }
  .badge.measure{ background:rgba(192,132,252,.15); color:var(--measure); }
  .row .meta{ margin-left:auto; color:var(--muted); font-size:11px; font-family:var(--mono); flex-shrink:0; }
  .row .tag{
    margin-left:auto; font-family:var(--mono); font-size:10px;
    padding:2px 6px; border-radius:3px; background:rgba(255,180,84,.12); color:var(--bookmark); flex-shrink:0;
  }
  .row .tag.warn{ background:rgba(255,122,69,.15); color:var(--action); }

  .info-card{
    background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px 16px;
    margin-bottom:20px; font-size:12.5px; color:var(--muted); line-height:1.6;
  }
  .info-card b{ color:var(--text); }
  .info-card.warn{ border-color:rgba(255,122,69,.55); }
  .info-card.bad{ border-color:rgba(248,113,113,.6); }
  .info-card.good{ border-color:rgba(74,222,128,.5); }
  .info-card h4{ margin:0 0 6px; font-size:13px; color:var(--text); }
  .info-card ul{ margin:6px 0 4px; padding-left:18px; }
  .info-card li{ margin-bottom:4px; }
  .info-card code{ font-family:var(--mono); font-size:11.5px; color:var(--text); word-break:break-all; }

  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
  .two-col h4{ margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:600; }
  pre.code{
    margin:0; background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:12px; font-family:var(--mono); font-size:11.5px; line-height:1.55; color:var(--text);
    overflow:auto; max-height:280px; white-space:pre;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--action); color:var(--text);
    padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; font-family:var(--sans); max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }

  @media (max-width: 800px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; border-right:none; border-bottom:1px solid var(--border); }
    .two-col{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand"><b>PBIP</b> Toolkit</div>

    <div class="mode-tabs">
      <button class="mode-tab active" data-mode-btn="convert">Make thin report</button>
      <button class="mode-tab" data-mode-btn="transplant">Transplant</button>
    </div>

    <label class="drop" id="dropDonor">
      <input type="file" id="inputDonor" webkitdirectory directory multiple />
      <div class="drop-label" id="donorLabel">Old dashboard</div>
      <div class="drop-sub" id="donorSub">The full dashboard as a PBIP project folder, including its .SemanticModel folder</div>
    </label>
    <div class="mini-summary" id="summaryDonor" style="display:none;"></div>

    <label class="drop" id="dropRecipient">
      <input type="file" id="inputRecipient" webkitdirectory directory multiple />
      <div class="drop-label" id="recipientLabel">Shell project</div>
      <div class="drop-sub" id="recipientSub">A report live-connected to the published model, saved as PBIP. Only its definition.pbir is used</div>
    </label>
    <div class="mini-summary" id="summaryRecipient" style="display:none;"></div>

    <input class="filter" id="filter" placeholder="Filter donor items…" style="display:none;" />

    <div class="opts" id="convOptions">
      <div class="opts-title">Output</div>
      <input class="text-in" id="outName" placeholder="Zip name (e.g. DUET-thin)" />
    </div>

    <div class="sidebar-footer">
      Everything runs locally in your browser. Nothing is uploaded anywhere. Files are read and zipped client-side. <br>
      © <a href="https://www.linkedin.com/in/sonam-wangchuk-557097257/" target="_blank" rel="noopener noreferrer">Sonam Wangchuk</a>, 2026
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <h1 id="topTitle">Swap the model link for the live connection</h1>
      <span class="sel-count" id="selCount"></span>
      <div class="spacer"></div>

      <button class="btn primary" id="convertBtn" disabled>Make thin report &amp; download</button>

      <button class="btn ghost" id="selectMissingBtn" style="display:none;">Select all new</button>
      <button class="btn primary" id="mergeBtn" style="display:none;" disabled>Merge &amp; download</button>
    </div>

    <div class="content" id="contentConvert"></div>
    <div class="content" id="contentTransplant" style="display:none;"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===========================================================
   Shared helpers
   =========================================================== */
const el = id => document.getElementById(id);

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

let toastTimer;
function showToast(msg){
  const t = el('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3600);
}

function filesFromInput(fileList){
  const map = {};
  for (const f of fileList) map[f.webkitRelativePath] = f;
  return map;
}

async function readTextFrom(fileMap, path){
  const f = fileMap[path];
  if (!f) return null;
  try { return await f.text(); } catch(e){ return null; }
}

async function readJSONFrom(fileMap, path){
  const t = await readTextFrom(fileMap, path);
  if (t === null) return null;
  try { return JSON.parse(t); } catch(e){ return null; }
}

function cloneJson(value){
  return value == null ? value : JSON.parse(JSON.stringify(value));
}

function generateGuid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function uniqueId(baseId, existingIds){
  if (!existingIds.has(baseId)) return baseId;
  let i = 1, candidate;
  do {
    candidate = `${baseId}-copy${i > 1 ? i : ''}`;
    i++;
  } while (existingIds.has(candidate));
  return candidate;
}

function uniqueMeasureName(base, existingNames){
  if (!existingNames.has(base)) return base;
  let i = 1, candidate;
  do {
    candidate = `${base} (copy${i > 1 ? ' ' + i : ''})`;
    i++;
  } while (existingNames.has(candidate));
  return candidate;
}

function renameMeasureBlockLines(lines, newName){
  const newLines = lines.slice();
  newLines[0] = newLines[0].replace(/^(\s*measure\s+)(?:'[^']*'|\S+)(\s*=)/, (m, p1, p2) => `${p1}'${newName}'${p2}`);
  return newLines;
}

function regenerateLineageTag(lines){
  return lines.map(l => /lineageTag:/.test(l) ? l.replace(/(lineageTag:\s*)(\S+)/, (m, p1) => `${p1}${generateGuid()}`) : l);
}

/* ---------- bookmark helpers (Transplant) ---------- */

function bookmarkReferencedPageIds(bookmarkJson){
  const ids = new Set();
  if (!bookmarkJson) return ids;
  const add = v => { if (typeof v === 'string' && v) ids.add(v); };

  if (bookmarkJson.options){
    add(bookmarkJson.options.activeSection);
    if (bookmarkJson.options.sections && typeof bookmarkJson.options.sections === 'object')
      Object.keys(bookmarkJson.options.sections).forEach(add);
  }
  if (bookmarkJson.explorationState){
    add(bookmarkJson.explorationState.activeSection);
    if (bookmarkJson.explorationState.sections && typeof bookmarkJson.explorationState.sections === 'object')
      Object.keys(bookmarkJson.explorationState.sections).forEach(add);
  }
  return ids;
}

function rewriteBookmarkPageReferences(bookmarkJson, pageIdMap){
  if (!bookmarkJson || !pageIdMap || pageIdMap.size === 0) return bookmarkJson;
  const out = cloneJson(bookmarkJson);
  const mapId = id => pageIdMap.get(id) || id;

  const remapSections = obj => {
    if (obj && obj.sections && typeof obj.sections === 'object' && !Array.isArray(obj.sections)){
      const next = {};
      for (const [k, v] of Object.entries(obj.sections)) next[mapId(k)] = v;
      obj.sections = next;
    }
  };

  if (out.options && typeof out.options === 'object'){
    if (typeof out.options.activeSection === 'string') out.options.activeSection = mapId(out.options.activeSection);
    remapSections(out.options);
  }
  if (out.explorationState && typeof out.explorationState === 'object'){
    if (typeof out.explorationState.activeSection === 'string')
      out.explorationState.activeSection = mapId(out.explorationState.activeSection);
    remapSections(out.explorationState);
  }
  return out;
}

function makeBookmarkIndexItem(id, sampleItem){
  if (typeof sampleItem === 'string') return id;
  if (sampleItem && typeof sampleItem === 'object' && !Array.isArray(sampleItem)){
    const clone = cloneJson(sampleItem);
    delete clone.children; // never inherit a group's children
    if ('bookmark' in clone) clone.bookmark = id;
    else if ('name' in clone) clone.name = id;
    else if ('id' in clone) clone.id = id;
    else return { name: id };
    return clone;
  }
  return { name: id };
}

function pickSampleBookmarkItem(...metas){
  for (const m of metas){
    if (m && Array.isArray(m.items) && m.items.length) return m.items[0];
  }
  return undefined;
}

function bookmarkDestinationPath(reportRoot, bookmarkId){
  return `${reportRoot}/definition/bookmarks/${bookmarkId}.bookmark.json`;
}

/* ---------- TMDL measure parsing (Transplant) ---------- */

function parseMeasuresFromTmdl(text, tableName, tablePath){
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let current = null;

  for (const line of lines){
    const m = line.match(/^\t(measure\s+(?:'([^']+)'|(\S+))\s*=.*)$/);
    if (m){
      if (current) blocks.push(current);
      current = { name: m[2] || m[3], lines: [line] };
      continue;
    }
    if (current){
      if (line === '' || /^\t\t/.test(line)){
        current.lines.push(line);
        continue;
      }
      blocks.push(current);
      current = null;
    }
  }
  if (current) blocks.push(current);

  return blocks.map(b => {
    while (b.lines.length && b.lines[b.lines.length - 1] === '') b.lines.pop();
    return {
      id: `${tablePath}#${b.name}`,
      table: tableName,
      tablePath,
      name: b.name,
      lines: b.lines,
      text: b.lines.join('\n')
    };
  });
}

/**
 * Parses a PBIP report project folder (PBIR format) for Transplant mode.
 * Returns null if no definition/pages/pages.json could be found.
 */
async function parseProject(fileMap){
  const pagesJsonPath = Object.keys(fileMap).find(p => p.endsWith('/definition/pages/pages.json'));
  if (!pagesJsonPath) return null;

  const reportRoot = pagesJsonPath.replace('/definition/pages/pages.json', '');
  const pagesMeta = (await readJSONFrom(fileMap, pagesJsonPath)) || { pageOrder: [] };
  const pageOrder = pagesMeta.pageOrder || [];

  const pages = [];
  for (const pageId of pageOrder){
    const pagePath = `${reportRoot}/definition/pages/${pageId}`;
    const pageJson = await readJSONFrom(fileMap, `${pagePath}/page.json`);
    const label = (pageJson && (pageJson.displayName || pageJson.name)) || pageId;
    pages.push({ id: pageId, label, path: pagePath });
  }

  const bookmarksDir = `${reportRoot}/definition/bookmarks`;
  const bookmarksJsonPath = `${bookmarksDir}/bookmarks.json`;
  const bookmarksMeta = await readJSONFrom(fileMap, bookmarksJsonPath);

  const bookmarkFiles = Object.keys(fileMap).filter(p =>
    p.startsWith(bookmarksDir + '/') &&
    (p.endsWith('.bookmark.json') ||
     (p.endsWith('.json') && !p.endsWith('/bookmarks.json') && !p.endsWith('.bookmark.json')))
  );
  const bookmarks = [];
  for (const bPath of bookmarkFiles){
    const bJson = await readJSONFrom(fileMap, bPath);
    const fileName = bPath.split('/').pop();
    const fallbackId = fileName.endsWith('.bookmark.json')
      ? fileName.slice(0, -'.bookmark.json'.length)
      : fileName.replace(/\.json$/, '');
    const id = (bJson && bJson.name) || fallbackId;
    const label = (bJson && bJson.displayName) || id;
    bookmarks.push({ id, label, path: bPath });
  }
  bookmarks.sort((a, b) => a.label.localeCompare(b.label));

  const tmdlPaths = Object.keys(fileMap).filter(p => /\/definition\/tables\/[^\/]+\.tmdl$/.test(p));
  const tables = [];
  for (const tPath of tmdlPaths){
    const text = await readTextFrom(fileMap, tPath);
    if (text === null) continue;
    const nameMatch = text.match(/^table\s+(?:'([^']+)'|(\S+))/m);
    const tableName = nameMatch ? (nameMatch[1] || nameMatch[2]) : tPath.split('/').pop().replace(/\.tmdl$/, '');
    tables.push({ name: tableName, path: tPath, measures: parseMeasuresFromTmdl(text, tableName, tPath) });
  }
  tables.sort((a, b) => a.name.localeCompare(b.name));
  const measures = [];
  for (const t of tables) for (const m of t.measures) measures.push(m);

  return {
    reportRoot, pagesJsonPath, pagesMeta, pages,
    bookmarksDir, bookmarksJsonPath, bookmarksMeta, bookmarks,
    tables, measures
  };
}

/* ===========================================================
   Folder analysis for "Make thin report"
   (works on raw file paths, so it does not need the PBIR page layout)
   =========================================================== */

/** How does this definition.pbir point at its model? */
function classifyPbir(text){
  if (text === null) return { connection: null, version: null };
  try {
    const j = JSON.parse(text);
    const ref = j && j.datasetReference;
    // Desktop writes "byConnection": null next to a real byPath, so test for real content
    const connection = (ref && ref.byConnection) ? 'byConnection'
                     : (ref && ref.byPath) ? 'byPath'
                     : 'unknown';
    return { connection, version: j && j.version != null ? String(j.version) : null };
  } catch(e){
    return { connection: 'unknown', version: null };
  }
}

async function analyseFolder(files){
  const paths = Object.keys(files);
  if (!paths.length) return null;

  const pbirPaths = paths.filter(p => /\.Report\/definition\.pbir$/.test(p));
  const pbirPath = pbirPaths[0] || null;
  const pbirText = pbirPath ? await readTextFrom(files, pbirPath) : null;
  const { connection, version } = classifyPbir(pbirText);

  // every top-level "<something>.SemanticModel" folder in the selection
  const folderCounts = new Map();
  for (const p of paths){
    const parts = p.split('/');
    for (let i = 0; i < parts.length - 1; i++){
      if (/\.SemanticModel$/i.test(parts[i])){
        const prefix = parts.slice(0, i + 1).join('/');
        folderCounts.set(prefix, (folderCounts.get(prefix) || 0) + 1);
        break;
      }
    }
  }
  const modelFolders = [...folderCounts.entries()].map(([prefix, count]) => ({ prefix, count }));

  return {
    root: paths[0].split('/')[0],
    fileCount: paths.length,
    pbirPath, pbirText, pbirCount: pbirPaths.length,
    connection, version,
    modelFolders
  };
}

/* ===========================================================
   State + loading
   =========================================================== */
let mode = 'convert';
const donor = { files: {}, project: null, info: null };
const recipient = { files: {}, project: null, info: null };
const tSel = new Set();   // Transplant selections
let convResult = null;

el('inputDonor').addEventListener('change', async (e) => {
  donor.files = filesFromInput(e.target.files);
  donor.project = await parseProject(donor.files);
  donor.info = await analyseFolder(donor.files);
  tSel.clear(); convResult = null;
  renderAll();
});

function updateButtons(){

function wireToggles(container, toggleFn){
  container.onclick = (e) => {
    const row = e.target.closest('[data-toggle]');
    if (!row || !container.contains(row)) return;
    toggleFn(row.getAttribute('data-toggle'));
  };
}

function withScroll(container, fn){
  const top = container.scrollTop;
  const winTop = window.scrollY;
  fn();
  container.scrollTop = top;
  window.scrollTo(0, winTop);
}

/* ===========================================================
   MAKE THIN REPORT
   Old dashboard in, same dashboard out, with:
     1. every *.SemanticModel folder deleted
     2. .Report/definition.pbir replaced by the shell's definition.pbir
   Pages, bookmarks, themes and resources are untouched.
   =========================================================== */

function convertCheck(){
  const d = donor.info, s = recipient.info;
  const problems = [], warnings = [];

  if (!d || !s) return { ok: false, problems, warnings };

  if (!d.pbirPath){
    problems.push('No <code>.Report/definition.pbir</code> in the old dashboard. Select the project folder that contains the <code>.Report</code> folder.');
  }
  if (!s.pbirPath){
    problems.push('No <code>.Report/definition.pbir</code> in the shell. Select the shell project folder.');
  } else if (s.connection !== 'byConnection'){
    problems.push(`The shell's <code>definition.pbir</code> is not a live connection (it ${s.connection === 'byPath' ? 'points to a local model' : 'has an unrecognised format'}). Use a shell created with <b>Get data → Power BI semantic models</b>. Swapping this file in would leave the report with no model.`);
  }

  if (d.pbirCount > 1) warnings.push(`The old dashboard has ${d.pbirCount} reports. Only <code>${escapeHtml(d.pbirPath)}</code> will be changed.`);
  if (s.pbirCount > 1) warnings.push(`The shell has ${s.pbirCount} reports. Only <code>${escapeHtml(s.pbirPath)}</code> is used.`);
  if (d.pbirPath && d.connection === 'byConnection'){
    warnings.push('The old dashboard is already live-connected. Only <code>definition.pbir</code> will be swapped.');
  } else if (d.pbirPath && d.modelFolders.length === 0){
    warnings.push('No <code>.SemanticModel</code> folder found inside the old dashboard folder. If the model sits outside the folder you selected, it will not be touched. Only <code>definition.pbir</code> will be swapped.');
  }
  if (s.version && d.pbirPath && donor.project && parseFloat(s.version) < 4){
    warnings.push(`The shell's definition.pbir is version ${escapeHtml(s.version)}, but the old dashboard uses the PBIR page layout, which needs version 4.0 or higher. Desktop may refuse to open the result.`);
  }

  return { ok: problems.length === 0, problems, warnings };
}

function renderConvert(){
  const box = el('contentConvert');
  const d = donor.info, s = recipient.info;

  if (!d || !s){
    const missing = !d && !s ? 'the old dashboard and the shell' : !d ? 'the old dashboard' : 'the shell';
    box.innerHTML = `<div class="empty"><h2>Load ${missing}</h2>
      <p>The tool deletes the <code>.SemanticModel</code> folder from the old dashboard and swaps in the shell's <code>definition.pbir</code>. Every page, bookmark, theme and image stays exactly as it was.</p></div>`;
    return;
  }

  const chk = convertCheck();
  let html = '';

  if (convResult){
    html += `<div class="info-card good">
      <h4>Downloaded ${escapeHtml(convResult.fileName)}</h4>
      Deleted ${convResult.removed} file${convResult.removed === 1 ? '' : 's'} in ${convResult.folders} model folder${convResult.folders === 1 ? '' : 's'}.
      Replaced <code>${escapeHtml(convResult.pbir)}</code>.
      Kept ${convResult.kept} other file${convResult.kept === 1 ? '' : 's'} unchanged.
    </div>`;
  }

  if (chk.problems.length){
    html += `<div class="info-card bad"><h4>Can't continue yet</h4><ul>${chk.problems.map(p => `<li>${p}</li>`).join('')}</ul></div>`;
  }
  if (chk.warnings.length){
    html += `<div class="info-card warn"><h4>Heads up</h4><ul>${chk.warnings.map(w => `<li>${w}</li>`).join('')}</ul></div>`;
  }

  // what will happen
  const removedTotal = d.modelFolders.reduce((n, f) => n + f.count, 0);
  const keptTotal = d.fileCount - removedTotal - (d.pbirPath ? 1 : 0);
  html += `<div class="info-card">
    <h4>What will happen</h4>
    <ul>
      <li><b>Delete</b> ${d.modelFolders.length
        ? d.modelFolders.map(f => `<code>${escapeHtml(f.prefix)}</code> (${f.count} file${f.count === 1 ? '' : 's'})`).join(', ')
        : 'nothing (no model folder found)'}</li>
      <li><b>Replace</b> ${d.pbirPath ? `<code>${escapeHtml(d.pbirPath)}</code>` : 'definition.pbir'} with the shell's ${s.pbirPath ? `<code>${escapeHtml(s.pbirPath)}</code>` : 'file'}</li>
      <li><b>Keep</b> the other ${keptTotal} file${keptTotal === 1 ? '' : 's'}: all pages, bookmarks, themes and resources</li>
    </ul>
  </div>`;

  html += `<div class="two-col">
    <div><h4>Old definition.pbir (will be replaced)</h4><pre class="code">${d.pbirText !== null ? escapeHtml(d.pbirText) : '(not found)'}</pre></div>
    <div><h4>New definition.pbir (from the shell)</h4><pre class="code">${s.pbirText !== null ? escapeHtml(s.pbirText) : '(not found)'}</pre></div>
  </div>`;

  html += `<div class="info-card">
    <b>Before you publish:</b> the result keeps the old dashboard's name. Publishing it to the same workspace as the full report would replace that report. Rename it first (in Desktop, <b>Save as</b> under a new name) or publish to a different workspace.
  </div>`;

  box.innerHTML = html;
}

async function runConvert(){
  const chk = convertCheck();
  if (!chk.ok) return;
  const d = donor.info, s = recipient.info;
  const btn = el('convertBtn');
  btn.disabled = true;
  btn.textContent = 'Working…';

  try {
    const prefixes = d.modelFolders.map(f => f.prefix + '/');
    const zip = new JSZip();
    let removed = 0, kept = 0;

    for (const [path, file] of Object.entries(donor.files)){
      if (prefixes.some(pf => path.startsWith(pf))){ removed++; continue; }
      if (path === d.pbirPath){
        // exact bytes of the shell's file
        zip.file(path, await recipient.files[s.pbirPath].arrayBuffer());
        continue;
      }
      zip.file(path, await file.arrayBuffer());
      kept++;
    }

    const rawName = el('outName').value.trim().replace(/[\\/:*?"<>|]/g, '_');
    const fileName = (rawName || `${d.root}-thin`) + '.zip';
    const blob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(blob, fileName);

    convResult = { fileName, removed, folders: d.modelFolders.length, kept, pbir: d.pbirPath };
    renderActive();
    el('contentConvert').scrollTop = 0;
    showToast(`Downloaded ${fileName}`);
  } catch (err){
    console.error(err);
    showToast('Something went wrong: ' + err.message);
  } finally {
    btn.textContent = 'Make thin report & download';
    updateButtons();
  }
}
el('convertBtn').addEventListener('click', runConvert);

/* ===========================================================
   TRANSPLANT MODE (donor -> recipient page/bookmark/measure copying)
   =========================================================== */

function renderTransplant(){
  const box = el('contentTransplant');
  wireToggles(box, id => {
    if (tSel.has(id)) tSel.delete(id); else tSel.add(id);
    renderActive();
  });

  if (!donor.project){
    box.innerHTML = `<div class="empty"><h2>Load a donor and a recipient</h2><p>Pick the donor project (where the pages, bookmarks and measures come from) and the recipient project (what you'll download at the end) on the left. Then tick what you want to copy over.</p></div>`;
    return;
  }

  withScroll(box, () => {
    const f = el('filter').value.trim().toLowerCase();
    const matches = label => !f || label.toLowerCase().includes(f);
    const recipientPageIds = new Set(recipient.project ? recipient.project.pages.map(p => p.id) : []);
    const recipientBookmarkIds = new Set(recipient.project ? recipient.project.bookmarks.map(b => b.id) : []);
    const recipientTableNames = new Set(recipient.project ? recipient.project.tables.map(t => t.name) : []);
    const recipientMeasureKeys = new Set(recipient.project ? recipient.project.measures.map(m => `${m.table}::${m.name}`) : []);

    let html = `<div class="info-card">Copies whole page folders (layout, visuals, thumbnails), bookmark files, and measure definitions. Page and bookmark ids are renamed on collision without overwriting the recipient. When a copied bookmark references a page that is also copied, its page references are remapped. If you copy a bookmark without its page, the bookmark is imported but the tool warns you that it still points to the donor.</div>`;

    const visiblePages = donor.project.pages.filter(p => matches(p.label));
    html += `<div class="section"><div class="section-head"><h3>Donor pages</h3></div>`;
    if (visiblePages.length === 0){
      html += `<div style="color:var(--muted); font-size:13px; padding:8px 0;">No matches.</div>`;
    } else {
      html += `<div class="page-group">`;
      for (const p of visiblePages){
        const checked = tSel.has(p.path) ? 'checked' : '';
        const willRename = recipient.project && recipientPageIds.has(p.id);
        html += `<div class="row page-row" data-toggle="${escapeHtml(p.path)}">
          <input type="checkbox" ${checked} />
          <span class="badge page">page</span>
          <span class="label">${escapeHtml(p.label)}</span>
          ${willRename ? `<span class="tag">id exists, will rename</span>` : ''}
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;

    const visibleBookmarks = donor.project.bookmarks.filter(b => matches(b.label));
    html += `<div class="section"><div class="section-head"><h3>Donor bookmarks</h3></div>`;
    if (donor.project.bookmarks.length === 0){
      html += `<div style="color:var(--muted); font-size:13px; padding:8px 0;">No bookmarks found in the donor project.</div>`;
    } else if (visibleBookmarks.length === 0){
      html += `<div style="color:var(--muted); font-size:13px; padding:8px 0;">No matches.</div>`;
    } else {
      html += `<div class="page-group">`;
      for (const b of visibleBookmarks){
        const checked = tSel.has(b.path) ? 'checked' : '';
        const willRename = recipient.project && recipientBookmarkIds.has(b.id);
        html += `<div class="row" data-toggle="${escapeHtml(b.path)}">
          <input type="checkbox" ${checked} />
          <span class="badge bookmark">bookmark</span>
          <span class="label">${escapeHtml(b.label)}</span>
          ${willRename ? `<span class="tag">id exists, will rename</span>` : ''}
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;

    const visibleMeasureTables = donor.project.tables
      .map(t => ({ ...t, measures: t.measures.filter(m => matches(m.name) || matches(t.name)) }))
      .filter(t => t.measures.length > 0);

    html += `<div class="section"><div class="section-head"><h3>Donor measures</h3></div>`;
    if (donor.project.tables.length === 0){
      html += `<div style="color:var(--muted); font-size:13px; padding:8px 0;">No semantic model tables found in the donor project.</div>`;
    } else if (visibleMeasureTables.length === 0){
      html += `<div style="color:var(--muted); font-size:13px; padding:8px 0;">No matches.</div>`;
    } else {
      for (const t of visibleMeasureTables){
        const tableExists = recipientTableNames.has(t.name);
        html += `<div class="page-group">
          <div class="row page-row static">
            <span class="label" style="font-weight:700;">${escapeHtml(t.name)}</span>
            ${recipient.project && !tableExists
              ? `<span class="tag warn">no matching table</span>`
              : `<span class="meta">${t.measures.length} measure${t.measures.length === 1 ? '' : 's'}</span>`}
          </div>`;
        for (const m of t.measures){
          const checked = tSel.has(m.id) ? 'checked' : '';
          const willRename = recipient.project && recipientMeasureKeys.has(`${t.name}::${m.name}`);
          html += `<div class="row" data-toggle="${escapeHtml(m.id)}">
            <input type="checkbox" ${checked} />
            <span class="badge measure">measure</span>
            <span class="label">${escapeHtml(m.name)}</span>
            ${willRename ? `<span class="tag">name exists, will rename</span>` : ''}
          </div>`;
        }
        html += `</div>`;
      }
    }
    html += `</div>`;

    box.innerHTML = html;
  });
}

el('selectMissingBtn').addEventListener('click', () => {
  if (!donor.project || !recipient.project) return;

  const recipientPageIds = new Set(recipient.project.pages.map(p => p.id));
  const recipientBookmarkIds = new Set(recipient.project.bookmarks.map(b => b.id));
  const recipientMeasureKeys = new Set(recipient.project.measures.map(m => `${m.table}::${m.name}`));

  tSel.clear();
  for (const p of donor.project.pages) if (!recipientPageIds.has(p.id)) tSel.add(p.path);
  for (const b of donor.project.bookmarks) if (!recipientBookmarkIds.has(b.id)) tSel.add(b.path);
  for (const m of donor.project.measures) if (!recipientMeasureKeys.has(`${m.table}::${m.name}`)) tSel.add(m.id);

  renderActive();
  showToast(`Selected ${tSel.size} missing items from donor`);
});

el('mergeBtn').addEventListener('click', async () => {
  if (!donor.project || !recipient.project || tSel.size === 0) return;

  el('mergeBtn').disabled = true;
  el('mergeBtn').textContent = 'Merging…';

  try {
    const working = {};
    for (const [path, file] of Object.entries(recipient.files)) working[path] = { kind: 'file', file };

    const existingPageIds = new Set(recipient.project.pages.map(p => p.id));
    const existingBookmarkIds = new Set(recipient.project.bookmarks.map(b => b.id));
    const newPageOrder = [...(recipient.project.pagesMeta.pageOrder || [])];

    const sampleItem = pickSampleBookmarkItem(recipient.project.bookmarksMeta, donor.project.bookmarksMeta);
    const newBookmarkItems = recipient.project.bookmarksMeta && Array.isArray(recipient.project.bookmarksMeta.items)
      ? [...recipient.project.bookmarksMeta.items] : [];

    // donor page id -> recipient page id, for every page selected in this merge
    const pageIdMap = new Map();
    for (const key of tSel){
      const dp = donor.project.pages.find(p => p.path === key);
      if (!dp) continue;
      const nid = uniqueId(dp.id, existingPageIds);
      pageIdMap.set(dp.id, nid);
      existingPageIds.add(nid);
    }

    const tableTextCache = {};
    const tableMeasureNames = {};
    const skippedMeasures = [];
    const bookmarkWarnings = [];
    let pagesAdded = 0, bookmarksAdded = 0, measuresAdded = 0;

    for (const key of tSel){
      const donorPage = donor.project.pages.find(p => p.path === key);
      const donorBookmark = donor.project.bookmarks.find(b => b.path === key);
      const donorMeasure = donor.project.measures.find(m => m.id === key);

      if (donorPage){
        const newId = pageIdMap.get(donorPage.id) || donorPage.id;
        const donorPrefix = donorPage.path + '/';

        for (const path of Object.keys(donor.files)){
          if (!path.startsWith(donorPrefix)) continue;
          const rel = path.slice(donorPrefix.length);
          const destPath = `${recipient.project.reportRoot}/definition/pages/${newId}/${rel}`;
          if (rel === 'page.json'){
            const pageJson = (await readJSONFrom(donor.files, path)) || {};
            pageJson.name = newId;
            working[destPath] = { kind: 'text', content: JSON.stringify(pageJson, null, 2) };
          } else {
            working[destPath] = { kind: 'file', file: donor.files[path] };
          }
        }
        newPageOrder.push(newId);
        pagesAdded++;

      } else if (donorBookmark){
        const newId = uniqueId(donorBookmark.id, existingBookmarkIds);
        existingBookmarkIds.add(newId);

        const rawBookmark = (await readJSONFrom(donor.files, donorBookmark.path)) || {};
        const referenced = bookmarkReferencedPageIds(rawBookmark);
        const missingPageRefs = [...referenced].filter(pid =>
          donor.project.pages.some(p => p.id === pid) && !pageIdMap.has(pid));

        const bJson = rewriteBookmarkPageReferences(rawBookmark, pageIdMap);
        bJson.name = newId;
        working[bookmarkDestinationPath(recipient.project.reportRoot, newId)] = {
          kind: 'text', content: JSON.stringify(bJson, null, 2)
        };
        newBookmarkItems.push(makeBookmarkIndexItem(newId, sampleItem));
        bookmarksAdded++;

        if (missingPageRefs.length){
          bookmarkWarnings.push(`${donorBookmark.label} references page(s) not selected for copy: ${missingPageRefs.join(', ')}`);
        }

      } else if (donorMeasure){
        const targetTable = recipient.project.tables.find(t => t.name === donorMeasure.table);
        if (!targetTable){
          skippedMeasures.push(`${donorMeasure.table} :: ${donorMeasure.name}`);
          continue;
        }
        if (!(targetTable.path in tableTextCache)){
          const baseText = await readTextFrom(recipient.files, targetTable.path);
          tableTextCache[targetTable.path] = baseText != null ? baseText : '';
          tableMeasureNames[targetTable.path] = new Set(
            recipient.project.measures.filter(m => m.table === targetTable.name).map(m => m.name));
        }
        const existingNames = tableMeasureNames[targetTable.path];
        const newName = uniqueMeasureName(donorMeasure.name, existingNames);
        existingNames.add(newName);

        let blockLines = donorMeasure.lines.slice();
        if (newName !== donorMeasure.name) blockLines = renameMeasureBlockLines(blockLines, newName);
        blockLines = regenerateLineageTag(blockLines);

        let currentText = tableTextCache[targetTable.path];
        if (!currentText.endsWith('\n')) currentText += '\n';
        currentText += '\n' + blockLines.join('\n') + '\n';
        tableTextCache[targetTable.path] = currentText;
        working[targetTable.path] = { kind: 'text', content: currentText };
        measuresAdded++;
      }
    }

    const pagesMetaClone = { ...recipient.project.pagesMeta, pageOrder: newPageOrder };
    if (!pagesMetaClone.activePageName && newPageOrder.length) pagesMetaClone.activePageName = newPageOrder[0];
    working[recipient.project.pagesJsonPath] = { kind: 'text', content: JSON.stringify(pagesMetaClone, null, 2) };

    if (bookmarksAdded > 0){
      const meta = recipient.project.bookmarksMeta
        ? { ...recipient.project.bookmarksMeta }
        : { "$schema": "https://developer.microsoft.com/json-schemas/fabric/item/report/definition/bookmarks/1.0.0/schema.json" };
      meta.items = newBookmarkItems;
      working[recipient.project.bookmarksJsonPath] = { kind: 'text', content: JSON.stringify(meta, null, 2) };
    }

    const zip = new JSZip();
    for (const [path, entry] of Object.entries(working)){
      if (entry.kind === 'text') zip.file(path, entry.content);
      else zip.file(path, await entry.file.arrayBuffer());
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    downloadBlob(blob, 'recipient-merged.zip');

    let msg = `Merged ${pagesAdded} page${pagesAdded === 1 ? '' : 's'}, ${bookmarksAdded} bookmark${bookmarksAdded === 1 ? '' : 's'} and ${measuresAdded} measure${measuresAdded === 1 ? '' : 's'} into the recipient`;
    if (skippedMeasures.length) msg += `. Skipped ${skippedMeasures.length} measure${skippedMeasures.length === 1 ? '' : 's'} (no matching table)`;
    if (bookmarkWarnings.length){
      msg += `. ${bookmarkWarnings.length} bookmark${bookmarkWarnings.length === 1 ? '' : 's'} point to pages you did not copy`;
      console.warn('Bookmark warnings:', bookmarkWarnings);
    }
    showToast(msg);
  } finally {
    el('mergeBtn').textContent = 'Merge & download';
    updateButtons();
  }
});

/* ---------- boot ---------- */
setMode('convert');
</script>
